<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김보민 | AI · Backend Developer</title>
  <meta name="description" content="동서대학교 소프트웨어학과 · 인공지능공학과 복수전공 김보민의 포트폴리오. 음성 AI와 로컬 LLM 기반 업무 자동화 프로젝트.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="김보민 | AI · Backend Developer">
  <meta property="og:description" content="음성 AI와 로컬 LLM으로 반복 업무를 자동화하는 개발자">
  <meta property="og:url" content="https://kitbomin.github.io/">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="logo">kitbomin<span>.dev</span></a>
      <nav class="nav-links" aria-label="주요 메뉴">
        <a href="#about">About</a>
        <a href="#thesis">Thesis</a>
        <a href="#projects">Projects</a>
        <a href="#blog" data-section-link="blog">Blog</a>
        <button class="theme-btn" type="button" aria-label="다크 모드 전환" id="themeBtn">◐</button>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero wrap">
      <p class="eyebrow" data-bind="role"></p>
      <h1><span data-bind="name"></span><small data-bind="nameEn"></small></h1>
      <p class="tagline" data-bind="tagline"></p>
      <div class="badges" id="eduBadges"></div>
      <div class="hero-actions">
        <a class="btn primary" href="#projects">프로젝트 보기</a>
        <a class="btn" id="ghLink" target="_blank" rel="noopener">GitHub</a>
        <a class="btn" id="velogLink" target="_blank" rel="noopener">Tech Blog</a>
        <a class="btn" id="mailLink">Contact</a>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="wrap section">
      <h2 class="section-title">About</h2>
      <div class="about-grid">
        <div>
          <p class="lead" data-bind="intro"></p>
          <div id="eduList" class="edu-list"></div>
        </div>
        <div id="stack" class="stack"></div>
      </div>
    </section>

    <!-- Thesis -->
    <section id="thesis" class="wrap section">
      <h2 class="section-title">Graduation Thesis</h2>
      <article class="thesis card">
        <h3 id="thesisTitle"></h3>
        <p class="muted en" id="thesisTitleEn"></p>
        <p id="thesisSummary"></p>
        <div class="metrics" id="thesisMetrics"></div>
        <div class="thesis-actions" id="thesisActions"></div>
      </article>
    </section>

    <!-- Projects -->
    <section id="projects" class="wrap section">
      <h2 class="section-title">Projects</h2>
      <div id="featured"></div>
      <div id="projectGrid" class="grid"></div>
    </section>

    <!-- Blog (velog 연동은 3단계에서 채워짐; 글이 없으면 숨김) -->
    <section id="blog" class="wrap section" hidden>
      <div class="section-head">
        <h2 class="section-title">Tech Blog</h2>
        <a class="more" id="velogMore" target="_blank" rel="noopener">velog에서 전체 보기 →</a>
      </div>
      <div id="postGrid" class="grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>© <span id="year"></span> 김보민 · Kim BoMin</span>
      <span class="footer-links" id="footerLinks"></span>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
