name: Sync velog posts

# 매일 새벽 3시(KST)에 velog 글 목록을 받아 data/posts.json 을 갱신한다.
# 변경이 있을 때만 github-actions[bot] 이 커밋 → GitHub Pages 가 자동으로 다시 배포된다.
# Actions 탭에서 "Run workflow" 로 수동 실행도 가능.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-velog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch posts from velog
        run: node scripts/sync-velog.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/posts.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git commit -m "chore: velog 글 목록 동기화"
          git push
